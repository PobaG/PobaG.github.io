<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<link rel="stylesheet" href="../style.css">

<body class="home-page">

    <div>
        <label for="custom-name">Enter custom name:</label>
        <input id="custom-name" type="text" placeholder="" />
    </div>
    <fieldset>
        <legend>Choose locale:</legend>
        <label for="us">US</label><input id="us" type="radio" name="uk-us" value="us" checked />
        <label for="uk">UK</label><input id="uk" type="radio" name="uk-us" value="uk" />
    </fieldset>
    <div>
        <button class="generate">Generate random story</button>
    </div>
    <!-- Thanks a lot to Willy Aguirre for his help with the code for this assessment -->
    <p class="story"></p>

    <script>
        // Complete variable definitions and random function

        const customName = document.getElementById("custom-name");
        const generateBtn = document.querySelector(".generate");
        const story = document.querySelector(".story");

        function randomValueFromArray(array) {
            const random = Math.floor(Math.random() * array.length);
            return array[random];
        }

        // Solution: Raw text strings

        const characters = ["Shrek", "Donkey", "Puss in Boots", "Gingy"];
        const places = ["the swamp", "outside Duloc", "a Far Far Away street", "the dragons lair"];
        const events = [
            "tripped over themselves trying to act normal",
            "started rambling nonsense and sweating profusely",
            "waved way too aggressively and knocked something over",
            "pretended to be busy but clearly weren't",
        ];

        // Solution: Partial return random string function

        function returnRandomStoryString() {
            const randomCharacter = randomValueFromArray(characters);
            const randomPlace = randomValueFromArray(places);
            const randomEvent = randomValueFromArray(events);

            let storyText = `It was 94 Fahrenheit outside, so ${randomCharacter} and their friend went for a walk. When they got to ${randomPlace}, they spotted Stacy's mom and completely froze — before realizing she had it going on, they panicked and ${randomEvent}. Doris the Ugly Stepsister saw the whole thing and absolutely judged them for it.`;

            return storyText;
        }

        // Solution: Event listener and partial generate function definition

        generateBtn.addEventListener("click", generateStory);

        function generateStory() {
            let newStory = returnRandomStoryString();

            if (customName.value !== "") {
                const name = customName.value;
                newStory = newStory.replace("Doris the Ugly Stepsister", name);
            }

            if (document.getElementById("uk").checked) {
                const weight = `${Math.round(300 / 14)} stone`;
                const temperature = `${Math.round((94 - 32) * (5 / 9))} Celsius`;
                newStory = newStory.replace("300 pounds", weight);
                newStory = newStory.replace("94 Fahrenheit", temperature);
            }

            story.textContent = newStory;
            story.style.visibility = "visible";
        }
    </script>

</body>

</html>
